[project]
name = "study-notebooks"
version = "0.1.0"
description = "個人学習用Notebookリポジトリ"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "matplotlib>=3.7,<4.0",
    "scikit-learn>=1.3,<2.0",
    "pandas>=2.0,<3.0",
    "jupyter>=1.0,<2.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0,<3.0",
]
dev = [
    "nbstripout>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
